<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEKMNS — พรีวิวเว็บไซต์ทั้งหมด</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#087A46;--gd:#075532;--gb:#19B86A;--gs:#EAF8F0;--bg:#F7F9FC;--sf:#fff;--tx:#172033;--t2:#687386;--bd:#E5EAF0;--sh:0 8px 30px #17203318;color-scheme:light}
[data-theme=dark]{--bg:#0b1220;--sf:#162033;--tx:#f1f5f9;--t2:#94a3b8;--bd:#263449;--gs:#12372a;--sh:0 8px 30px #0008;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}.ic.s{width:16px;height:16px}.ic.l{width:26px;height:26px}
.ban{background:#fef3c7;color:#92400e;font-size:12px;padding:7px 12px;text-align:center}
[data-theme=dark] .ban{background:#422006;color:#fde68a}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.tin{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--t2);position:relative;transition:background .2s,transform .15s}
.ib:hover{background:var(--bd);color:var(--tx)}.ib:active{transform:scale(.9)}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}.logo img{height:38px}.logo small{display:none;font-size:9px;letter-spacing:.16em;color:var(--t2);font-weight:600}
.nav{display:none;gap:2px}.nav a{padding:8px 13px;border-radius:99px;font-size:14px;font-weight:500;color:var(--t2);transition:.2s}.nav a:hover{background:var(--bd);color:var(--tx)}.nav a.on{background:var(--gs);color:var(--g)}
@media(min-width:1100px){.logo small{display:block}}@media(min-width:900px){.nav{display:flex}.hbg{display:none}.logo{margin-right:12px}.sp{flex:1}.bn{display:none!important}}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid var(--sf)}
.bell:hover svg{animation:wig .5s}@keyframes wig{25%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}75%{transform:rotate(7deg)}}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--gb));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;position:relative;flex:none;border:0}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--sf)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 22px;border-radius:99px;border:0;font-weight:600;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.bp{background:var(--g);color:#fff}.bp:hover{background:var(--gd);box-shadow:0 8px 20px color-mix(in srgb,var(--g) 40%,transparent)}
.bd{background:var(--tx);color:var(--bg)}.bg{background:var(--bd);color:var(--tx)}.bw{background:#fff;color:#075532}.bo{background:#ffffff26;color:#fff}
.bgo{background:#fff;color:#1f2937;border:1px solid #dadce0;height:50px;width:100%}.bgo:hover{box-shadow:0 4px 14px #0002}
.menu{position:absolute;right:14px;top:60px;width:min(300px,calc(100vw - 28px));background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:8px;transform-origin:top right;animation:pop .18s ease;z-index:50}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(-6px)}}
.mh{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--bd);margin-bottom:6px}.mh b{display:block;font-size:15px}.mh span{font-size:12px;color:var(--t2);word-break:break-all}
.mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;width:100%;border:0;background:none;text-align:left;transition:background .15s,padding .15s}.mi:hover{background:var(--bd);padding-left:16px}.mi.r{color:#dc2626}.hr{height:1px;background:var(--bd);margin:6px 0}
#scrim{position:fixed;inset:0;background:#0006;z-index:60;opacity:0;pointer-events:none;transition:.25s}#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(340px,86vw);background:var(--sf);z-index:70;border-radius:0 28px 28px 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow-y:auto}
#drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dh img{height:42px}
.uc{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:0 4px 14px #17203310;margin-bottom:10px}.uc b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uc small{color:var(--t2);font-size:12px}.uc>div{min-width:0}
.di{display:flex;align-items:center;gap:16px;padding:14px 10px;border-radius:14px;font-weight:500;font-size:15px;border:0;background:none;width:100%;text-align:left;transition:.2s}.di:hover{background:var(--bd);transform:translateX(4px)}.di.on{background:var(--gs);color:var(--g);font-weight:600}.di em{margin-left:auto;font-style:normal;color:var(--t2);font-size:13px}
.dl{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t2);margin:12px 10px 2px}
.promo{margin-top:auto;background:var(--bd);border-radius:26px;padding:20px;text-align:center}.promo .pi{width:60px;height:60px;border-radius:18px;background:var(--sf);display:grid;place-items:center;margin:0 auto 10px;color:var(--g)}.promo b{display:block}.promo small{color:var(--t2)}
main{max-width:1180px;margin:0 auto;padding:16px 14px 110px}
.pg{animation:up .45s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
h2.sh{font-size:18px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:end}h2.sh a{font-size:13px;color:var(--g);font-weight:600;display:flex;align-items:center;gap:4px}
h1{margin:0}.sub{color:var(--t2);font-size:13px;margin:4px 0 14px}.mut{color:var(--t2);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:16px;transition:transform .25s,box-shadow .25s,border-color .25s}
.lift:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--gb)}
.hero{background:var(--g);color:#fff;border-radius:32px;padding:26px;position:relative;overflow:hidden;transition:background .3s}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c;animation:fl 9s ease-in-out infinite}
.hero:before{width:200px;height:200px;right:-50px;top:-70px}.hero:after{width:130px;height:130px;right:90px;bottom:-60px;animation-delay:-4s;background:#19b86a55}
@keyframes fl{50%{transform:translate(-14px,12px) scale(1.07)}}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(23px,5vw,38px);line-height:1.2;max-width:640px}.hero p{margin:8px 0 0;opacity:.9;max-width:520px}.hero .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:16px;background:#ffffff26;border-radius:99px;padding:7px 14px;font-size:13px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)!important}.gs2{grid-template-columns:1fr 1fr!important}.g4{grid-template-columns:repeat(4,1fr)}}
.ibx{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;margin-bottom:10px;transition:transform .3s}.lift:hover .ibx{transform:rotate(-8deg) scale(1.1)}
.row2{display:flex;align-items:center;gap:12px}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--gs);color:var(--g);white-space:nowrap}
.pl{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--bd);margin-bottom:8px;transition:.2s}.pl.now{border-color:var(--gb);background:var(--gs)}.pl i{width:5px;height:36px;border-radius:9px;flex:none}.pl b{font-size:14px;display:block}.pl small{font-size:12px;color:var(--t2)}.pl .tm{margin-left:auto;text-align:right;font-size:12px;font-weight:500}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.cp{flex:none;border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:8px 16px;font-size:13px;color:var(--t2);transition:.2s}.cp.on{background:var(--g);border-color:var(--g);color:#fff}
.seg{display:flex;background:var(--bd);border-radius:99px;padding:4px;max-width:440px}.seg button{flex:1;height:42px;border:0;border-radius:99px;background:none;color:var(--t2);font-weight:600;font-size:14px;transition:.25s}.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px #0003}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.cal i{font-style:normal;font-size:12px;color:var(--t2);padding:6px 0}
.cal button{height:48px;border:0;border-radius:14px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;transition:.2s}.cal button:hover{background:var(--bd)}.cal .t{background:var(--gs);color:var(--g);font-weight:700}.cal .s{background:var(--ac,var(--g));color:#fff;font-weight:700}.cal u{display:flex;gap:2px;height:6px}.cal u s{width:6px;height:6px;border-radius:50%}
.ev{display:flex;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:16px;margin-top:8px;background:var(--sf);transition:.2s}.ev:hover{transform:translateX(4px)}.ev i{width:5px;border-radius:9px;flex:none}.ev b{font-size:14px;display:block}.ev span{font-size:12px;color:var(--t2)}
.sec{display:grid;gap:14px}@media(min-width:860px){.sec.c2{grid-template-columns:1fr 340px}}
.warn{background:#fef3c7;color:#92400e;border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px;display:flex;gap:8px;align-items:center}
.fld{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);font:inherit;margin-top:6px}.fld:focus{outline:2px solid var(--gb);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:12px;color:var(--t2);text-align:left;padding:10px;background:var(--bg)}td{padding:12px 10px;border-top:1px solid var(--bd)}tbody tr{transition:background .15s}tbody tr:hover{background:var(--gs)}.wrap{overflow-x:auto}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}.s0{background:var(--bd);color:var(--t2)}.s1{background:#fef3c7;color:#92400e}.s2{background:#dcfce7;color:#166534}
/* admin */
.adm{display:grid;gap:18px}@media(min-width:1000px){.adm{grid-template-columns:230px 1fr}}
.adm>*{min-width:0}.side{display:none}@media(min-width:1000px){.side{display:block;position:sticky;top:78px;align-self:start}}
.side .di{padding:11px 12px;font-size:14px}
.kp{padding:20px;min-height:260px;display:flex;flex-direction:column}.kp h3{margin:0;font-size:17px}.kp .num{font-size:30px;font-weight:700}.kp .dl2{font-size:13px;color:#16a34a;font-weight:600;margin-left:6px}.kp .ch{flex:1;display:flex;align-items:center;justify-content:center;min-height:110px}
.bars{display:flex;gap:10px;align-items:flex-end;height:110px}.bars i{width:18px;border-radius:99px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--bd);transform-origin:bottom;animation:gr .9s cubic-bezier(.2,.8,.2,1) both}.bars i b{display:block;width:100%}
@keyframes gr{from{transform:scaleY(0)}}
.line path{stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.4s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.donut circle.v{stroke-dasharray:0 100;animation:dn 1.4s .2s forwards}@keyframes dn{to{stroke-dasharray:var(--p) 100}}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.col{background:color-mix(in srgb,var(--bd) 55%,transparent);border-radius:20px;padding:10px;scroll-snap-align:start;min-height:300px}.col h4{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between}.col .card{padding:12px;margin-bottom:8px;border-radius:16px;cursor:grab}
.pr{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pr b{display:block;height:100%;background:var(--g);border-radius:9px;transform-origin:left;animation:pw 1s both}@keyframes pw{from{transform:scaleX(0)}}
/* footer & nav */
footer{border-top:1px solid var(--bd);background:var(--sf);padding:30px 14px calc(100px + env(safe-area-inset-bottom))}.fin{max-width:1180px;margin:0 auto;display:grid;gap:26px}@media(min-width:800px){.fin{grid-template-columns:1.3fr 1fr 1fr}footer{padding-bottom:30px}}
footer h5{margin:0 0 10px;font-size:13px}footer a.fl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);padding:5px 0;transition:.2s}footer a.fl:hover{color:var(--g);transform:translateX(4px)}
.pt{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}.pt img{height:30px;filter:grayscale(1);opacity:.7;transition:.3s}.pt img:hover{filter:none;opacity:1}[data-theme=dark] .pt img{background:#fff;padding:4px 8px;border-radius:8px}
.bn{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:color-mix(in srgb,var(--sf) 94%,transparent);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:28px;padding:6px;box-shadow:var(--sh)}
.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:22px;font-size:10.5px;font-weight:600;color:var(--t2);transition:.25s}.bn a.on{background:var(--gs);color:var(--g)}.bn a.on svg{animation:bo .4s}@keyframes bo{50%{transform:translateY(-4px) scale(1.15)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:90;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
#srch{position:fixed;inset:0;z-index:80;background:#0007;display:none;padding:70px 14px}#srch.on{display:block}#srch>div{max-width:520px;margin:0 auto;background:var(--sf);border-radius:22px;padding:12px;animation:pop .2s}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}
</style>
</head>

function fx(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});$$(".rv:not(.in)").forEach(e=>io.observe(e));$$(".cnt").forEach(e=>{const v=e.dataset.v;if(isNaN(v)){e.textContent=v;return}let t=0;const s=performance.now(),f=n=>{t=Math.min(1,(n-s)/900);e.textContent=Math.round(v*(1-Math.pow(1-t,3)));t<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}
