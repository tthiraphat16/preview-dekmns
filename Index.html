<style>

*{box-sizing:border-box}html,body{margin:0}

.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)!important}.gs2{grid-template-columns:1fr 1fr!important}.g4{grid-template-columns:repeat(4,1fr)}}

.bars{display:flex;gap:10px;align-items:flex-end;height:110px}.bars i{width:18px;border-radius:99px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--bd);transform-origin:bottom;animation:gr .9s cubic-bezier(.2,.8,.2,1) both}.bars i b{display:block;width:100%}

.line path{stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.4s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}

.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.col{background:color-mix(in srgb,var(--bd) 55%,transparent);border-radius:20px;padding:10px;scroll-snap-align:start;min-height:300px}.col h4{margin:4px 6px 10px;font-size:13px;display:flex;justify-content:space-between}.col .card{padding:12px;margin-bottom:8px;border-radius:16px;cursor:grab}

/* footer & nav */
footer{border-top:1px solid var(--bd);background:var(--sf);padding:30px 14px calc(100px + env(safe-area-inset-bottom))}.fin{max-width:1180px;margin:0 auto;display:grid;gap:26px}@media(min-width:800px){.fin{grid-template-columns:1.3fr 1fr 1fr}footer{padding-bottom:30px}}

.pt{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}.pt img{height:30px;filter:grayscale(1);opacity:.7;transition:.3s}.pt img:hover{filter:none;opacity:1}[data-theme=dark] .pt img{background:#fff;padding:4px 8px;border-radius:8px}

const FQ={th:[["ใครเข้าสู่ระบบ DEKMNS ได้บ้าง?","เฉพาะบัญชี Google ของโรงเรียนที่ลงท้ายด้วย @mns.ac.th และยืนยันอีเมลแล้ว ระบบตรวจสอบที่ฝั่งเซิร์ฟเวอร์"],["เข้าสู่ระบบไม่ได้ ต้องทำอย่างไร?","ตรวจสอบว่าเลือกบัญชี @mns.ac.th หากยังไม่พบข้อมูลนักเรียน ให้ส่งเรื่องที่เมนู “แจ้งปัญหา / ส่งข้อเสนอแนะ” พร้อมรหัสนักเรียน"],["ทำไมตารางเรียนของฉันไม่ขึ้น?","ตารางจะแสดงเมื่อบัญชีเชื่อมกับข้อมูลนักเรียนแล้ว และห้องของคุณมีตารางในระบบ หากยังไม่มีให้แจ้งผู้ดูแล"],["ร้องเรียนแบบไม่ระบุตัวตนได้ไหม และติดตามอย่างไร?","ได้ เมื่อส่งเรื่องคุณจะได้รหัส เช่น SZ-1042 นำไปกรอกที่แท็บ “ตรวจสอบสถานะ” ในหน้าร้องเรียน"],["เพิ่มกิจกรรมลง Google Calendar อย่างไร?","กดที่กิจกรรมในปฏิทิน แล้วกดปุ่ม “เพิ่มไปยัง Google Calendar”"],["แจ้งของหายหรือของที่พบอย่างไร?","ไปที่หน้า “ของหาย” แล้วกด “แจ้งรายการ” เลือกว่าหายหรือพบ ใส่รายละเอียดและสถานที่"],["ข้อมูลส่วนตัวของฉันปลอดภัยไหม?","เราเก็บเท่าที่จำเป็นและไม่แสดงข้อมูลส่วนตัวต่อสาธารณะ อ่านเพิ่มเติมที่นโยบายความเป็นส่วนตัว"]],
en:[["Who can sign in to DEKMNS?","Only school Google accounts ending in @mns.ac.th with a verified email. The check is done on the server."],["I can't sign in. What should I do?","Make sure you picked your @mns.ac.th account. If your student record isn't found, send a report from “Report a problem / Feedback” with your student ID."],["Why doesn't my timetable show?","It appears once your account is linked to a student record and your class has a timetable. If not, tell an admin."],["Can I file a complaint anonymously, and how do I track it?","Yes. You get a code such as SZ-1042 after submitting. Enter it in the “Check status” tab on the complaint page."],["How do I add an event to Google Calendar?","Tap the event in the calendar, then tap “Add to Google Calendar”."],["How do I report a lost or found item?","Open “Lost & Found”, tap “Report item”, choose lost or found, then add details and the location."],["Is my personal data safe?","We keep only what's needed and never show personal data publicly. See the Privacy Policy for details."]],
zh:[["哪些人可以登录 DEKMNS？","仅限以 @mns.ac.th 结尾且已验证邮箱的学校 Google 账户，由服务器端校验。"],["无法登录怎么办？","请确认选择了 @mns.ac.th 账户。若找不到学生信息，请通过“报告问题 / 提交建议”提交并附上学号。"],["为什么看不到我的课程表？","账户关联学生信息且班级已有课程表后才会显示。否则请联系管理员。"],["可以匿名投诉吗？如何跟踪？","可以。提交后会获得类似 SZ-1042 的编号，在投诉页的“查询状态”标签输入即可。"],["如何把活动添加到 Google 日历？","点击日历中的活动，然后点击“添加到 Google 日历”。"],["如何上报失物或拾物？","进入“失物招领”，点击“上报物品”，选择丢失或拾到，并填写详情和地点。"],["我的个人信息安全吗？","我们仅收集必要信息，不会公开个人数据。详见隐私政策。"]],
id:[["Siapa yang bisa masuk ke DEKMNS?","Hanya akun Google sekolah berakhiran @mns.ac.th dengan email terverifikasi. Pemeriksaan dilakukan di server."],["Saya tidak bisa masuk. Apa yang harus dilakukan?","Pastikan memilih akun @mns.ac.th. Jika data siswa tidak ditemukan, kirim laporan lewat “Lapor masalah / Saran” beserta NIS."],["Mengapa jadwal saya tidak muncul?","Jadwal muncul setelah akun terhubung ke data siswa dan kelas Anda punya jadwal. Jika belum, hubungi admin."],["Bisakah mengadu secara anonim dan bagaimana melacaknya?","Bisa. Setelah mengirim Anda mendapat kode seperti SZ-1042. Masukkan di tab “Cek status” pada halaman pengaduan."],["Bagaimana menambahkan acara ke Google Calendar?","Ketuk acara di kalender, lalu ketuk “Tambahkan ke Google Calendar”."],["Bagaimana melaporkan barang hilang atau ditemukan?","Buka “Barang Hilang”, ketuk “Lapor barang”, pilih hilang atau ditemukan, lalu isi detail dan lokasi."],["Apakah data pribadi saya aman?","Kami hanya menyimpan yang diperlukan dan tidak menampilkan data pribadi ke publik. Lihat Kebijakan Privasi."]],
ja:[["DEKMNSにログインできるのは誰ですか？","@mns.ac.thで終わる学校のGoogleアカウント（メール確認済み）のみです。確認はサーバー側で行います。"],["ログインできないときは？","@mns.ac.thのアカウントを選んでいるか確認してください。学生情報が見つからない場合は「不具合報告・ご意見」から学籍番号を添えて送信してください。"],["時間割が表示されないのはなぜ？","アカウントが学生情報と紐づき、クラスの時間割が登録されると表示されます。未登録の場合は管理者に連絡してください。"],["匿名で苦情を送れますか？追跡方法は？","はい。送信後にSZ-1042のようなコードが発行されます。苦情ページの「状況確認」タブに入力してください。"],["イベントをGoogleカレンダーに追加するには？","カレンダーでイベントをタップし、「Googleカレンダーに追加」を押します。"],["落とし物・拾得物を届け出るには？","「落とし物」ページで「届出する」を押し、紛失か拾得かを選び、詳細と場所を入力します。"],["個人情報は安全ですか？","必要な情報のみ保存し、個人情報を公開しません。詳しくはプライバシーポリシーをご覧ください。"]]};
function faq(){const L=FQ[S.lang];return `<h1>คำถามที่พบบ่อย</h1><p class="sub">ค้นหาคำตอบเกี่ยวกับการใช้งาน DEKMNS</p><div style="max-width:760px"><div class="row2" style="position:relative;margin-bottom:12px"><span style="position:absolute;left:14px;color:var(--t2)">${ic("search","s")}</span><input class="fld" style="margin:0;padding-left:40px" id="fq" placeholder="ค้นหาคำถาม" oninput="faqQ(this.value)"></div><div id="fql">${L.map((x,i)=>`<details class="fq card" ${i==0?"open":""}><summary>${x[0]}<span class="chv">${ic("go","s")}</span></summary><p>${x[1]}</p></details>`).join("")}</div><p class="mut" id="fqe" hidden>ไม่พบคำถามที่ตรงกัน</p><div class="card" style="margin-top:16px;background:var(--gs);border-color:transparent"><b>ยังหาคำตอบไม่เจอ?</b><div class="grid g2" style="margin-top:12px"><a class="btn bp" href="#/feedback">${ic("chat","s")} ติดต่อเรา</a><a class="btn bg" href="mailto:support@dekmns.com">${ic("mail","s")} support@dekmns.com</a></div></div></div>`}
function faqQ(v){v=v.trim().toLowerCase();let n=0;$$(".fq").forEach(d=>{const h=v&&!d.textContent.toLowerCase().includes(v);d.hidden=h;if(!h)n++;if(v&&!h)d.open=true});$("#fqe").hidden=n>0}
const AREAS=["หน้าแรก","ตารางเรียน","ข่าวสาร","ปฏิทิน","แผนที่","ของหาย","ร้องเรียน","โปรไฟล์","เข้าสู่ระบบ","อื่น ๆ"];
function feedback(){if(S.fsucc)return `<div class="card pg" style="max-width:560px;margin:20px auto;text-align:center;padding:28px"><div class="ibx" style="background:var(--gs);color:var(--g);margin:0 auto 12px;width:60px;height:60px">${ic("check","l")}</div><h2 style="margin:0">ส่งแล้ว ขอบคุณที่ช่วยปรับปรุง DEKMNS</h2><p class="mut">รหัสอ้างอิง</p><b style="font-size:24px;letter-spacing:.06em">${S.fsucc}</b><div><button class="btn bp" style="margin-top:16px" data-fnew="1">ส่งอีกครั้ง</button></div></div>`;
return `<h1>แจ้งปัญหาการใช้งาน / ส่งข้อเสนอแนะ</h1><p class="sub">บอกเราว่าเว็บไซต์ควรดีขึ้นอย่างไร</p><div class="sec c2"><div class="card"><div class="seg" id="fty" style="margin-bottom:12px"><button class="on" data-fty="0">แจ้งปัญหา</button><button data-fty="1">ข้อเสนอแนะ</button></div><label class="mut">ส่วนของเว็บไซต์<select class="fld" id="far">${AREAS.map(a=>`<option>${a}</option>`).join("")}</select></label><label class="mut" style="display:block;margin-top:12px">หัวข้อ<input class="fld" id="fsu" maxlength="80"></label><label class="mut" style="display:block;margin-top:12px">รายละเอียด<textarea class="fld" id="fde" rows="5" maxlength="1000"></textarea></label><label class="mut" style="display:block;margin-top:12px">แนบภาพหน้าจอ (ไม่บังคับ)<input class="fld" id="fsc" type="file" accept="image/*"></label><label class="row2" style="margin-top:12px;font-size:13px"><input type="checkbox" id="fbr" checked> แนบข้อมูลเบราว์เซอร์เพื่อช่วยวิเคราะห์ปัญหา</label><p id="fer" style="color:#dc2626;font-size:13px;min-height:18px;margin:8px 0 0"></p><button class="btn bp" style="width:100%" onclick="subFb()">${ic("send","s")} ส่งข้อความ</button></div><aside><b>รายการที่เคยส่ง</b>${S.fb.map(f=>`<div class="ev" style="cursor:default"><i style="background:${f.ty?"#7c3aed":"#ea580c"}"></i><div><b>${f.code}</b><span>${f.ty?T("ข้อเสนอแนะ"):T("แจ้งปัญหา")} · ${f.ar} · ${dSh(f.d)}</span></div></div>`).join("")||`<p class="mut">—</p>`}</aside></div>`}
function subFb(){const ty=$("#fty .on").dataset.fty,su=$("#fsu").value.trim(),de=$("#fde").value.trim();if(de.length<10||!su){$("#fer").textContent=T("กรุณากรอกรายละเอียดอย่างน้อย 10 ตัวอักษร");return}
const code="FB-"+String(1000+Math.floor(Math.random()*9000));S.fb.unshift({code,ty:+ty,ar:$("#far").value,d:TODAY});ST.s("fb",S.fb);S.fsucc=code;render()}
const CMP0={"SZ-1042":{ty:"ความปลอดภัย",d:ad(TODAY,-1),s:0},"SZ-1038":{ty:"การเรียนการสอน",d:ad(TODAY,-5),s:1},"SZ-1020":{ty:"ความปลอดภัย",d:ad(TODAY,-20),s:3}};
const STL=["รับเรื่องแล้ว","กำลังตรวจสอบ","กำลังดำเนินการ","เสร็จสิ้น"],STC=["#2563eb","#d97706","#7c3aed","#16a34a"];
const cRes=()=>{if(!S.cres)return"";const r=S.cres.r;if(!r)return `<div class="warn" role="alert" style="background:#fee2e2;color:#991b1b;margin-top:12px">${ic("bell","s")} ไม่พบรหัสนี้ กรุณาตรวจสอบอีกครั้ง</div>`;return `<div class="card" style="margin-top:12px"><div class="row2" style="justify-content:space-between;flex-wrap:wrap"><div><b style="font-size:20px;letter-spacing:.04em">${r.code}</b><div class="mut">${r.ty} · ส่งเมื่อ ${dTh(r.d)}</div></div><span class="pill" style="background:${STC[r.s]}22;color:${STC[r.s]}">${STL[r.s]}</span></div><ol class="tl">${STL.map((x,i)=>`<li class="${i<r.s?"dn":i==r.s?"cur":""}"><span>${i<r.s||r.s==3?ic("check","s"):i+1}</span><b>${x}</b></li>`).join("")}</ol><p class="mut" style="margin:6px 0 0">${ic("lock","s")} ไม่แสดงรายละเอียดเรื่องเพื่อความเป็นส่วนตัว</p></div>`};
function complaint(){const tabs=`<div class="seg" style="margin-bottom:14px"><button class="${S.cc==0?"on":""}" data-cc="0">ส่งเรื่อง</button><button class="${S.cc==1?"on":""}" data-cc="1">ตรวจสอบสถานะ</button></div>`;let b;
if(S.cc==1)b=`<div class="card" style="max-width:640px"><div class="row2"><input class="fld" style="margin:0;text-transform:uppercase" id="cq" value="${S.cq}" placeholder="กรอกรหัสเรื่อง เช่น SZ-1042" maxlength="12"><button class="btn bp" data-chk="1" style="flex:none">${ic("search","s")} เช็กสถานะ</button></div>${S.cmp.length?`<div class="mut" style="margin-top:12px">รหัสของฉัน</div><div class="chips">${S.cmp.map(x=>`<button class="cp" data-chkc="${x.code}">${x.code}</button>`).join("")}</div>`:""}<p class="mut" style="margin:10px 0 0;font-size:12px">ตัวอย่างรหัสสำหรับทดลอง: SZ-1042, SZ-1038, SZ-1020</p>${cRes()}</div>`;
else if(S.csucc)b=`<div class="card pg" style="max-width:560px;text-align:center;padding:28px"><div class="ibx" style="background:var(--gs);color:var(--g);margin:0 auto 12px;width:60px;height:60px">${ic("check","l")}</div><h2 style="margin:0">ส่งเรื่องเรียบร้อย</h2><p class="mut">เก็บรหัสนี้ไว้เพื่อตรวจสอบสถานะ</p><b style="font-size:28px;letter-spacing:.08em">${S.csucc}</b><div class="grid g2" style="margin-top:16px"><button class="btn bg" data-copy="${S.csucc}">${ic("copy","s")} คัดลอกรหัส</button><button class="btn bp" data-chkc="${S.csucc}">${ic("search","s")} เช็กสถานะ</button></div><button class="btn" style="margin-top:8px;background:none;color:var(--t2)" data-cnew="1">ส่งอีกครั้ง</button></div>`;
else b=`<div class="grid g2 g3" style="margin-bottom:14px">${[["lock","เป็นความลับ","เฉพาะผู้ดูแลที่ได้รับสิทธิ์เห็นรายละเอียด"],["shield","ติดตามสถานะ","รับรหัสเพื่อติดตามได้ภายหลัง"],["chat","แจ้งได้ทุกเรื่อง","เลือกประเภทแล้วอธิบายสั้น ๆ"]].map(x=>`<div class="card lift"><div class="ibx" style="background:var(--gs);color:var(--g)">${ic(x[0])}</div><b>${x[1]}</b><div class="mut">${x[2]}</div></div>`).join("")}</div><div class="card" style="max-width:640px"><label class="mut">ประเภทเรื่อง<select class="fld" id="cty"><option>ความปลอดภัย</option><option>การเรียนการสอน</option><option>สิ่งอำนวยความสะดวก</option><option>อื่น ๆ</option></select></label><label class="mut" style="display:block;margin-top:12px">รายละเอียด<textarea class="fld" id="cde" rows="4" maxlength="1500"></textarea></label><label class="row2" style="margin-top:12px;font-size:13px"><input type="checkbox" id="can" checked> ไม่ระบุตัวตนต่อบุคคลทั่วไป</label><p id="cer" style="color:#dc2626;font-size:13px;min-height:18px;margin:8px 0 0"></p><button class="btn bp" onclick="subCmp()">${ic("shield","s")} ส่งเรื่อง</button></div>`;
return `<h1>ร้องเรียน / Safe Zone</h1><p class="sub">พื้นที่ปลอดภัยสำหรับส่งข้อเสนอแนะหรือร้องเรียน</p>${tabs}${b}`}
function subCmp(){const de=$("#cde").value.trim();if(de.length<10){$("#cer").textContent=T("กรุณากรอกรายละเอียดอย่างน้อย 10 ตัวอักษร");return}let c;do c="SZ-"+(1100+Math.floor(Math.random()*8900));while(cLook(c));S.cmp.unshift({code:c,ty:$("#cty").value,d:TODAY,s:0});ST.s("cmp",S.cmp);S.csucc=c;render()}
function chk(c){c=(c||"").trim().toUpperCase();S.cq=c;S.cres={r:cLook(c)};S.cc=1;S.csucc=null}
const igH=v=>{v=v.trim();if(!v)return"";let m=v.match(/^(?:https?:\/\/)?(?:www\.)?instagram\.com\/([A-Za-z0-9._]{1,30})\/?(?:\?.*)?$/i);if(m)return m[1];m=v.match(/^@?([A-Za-z0-9._]{1,30})$/);return m?m[1]:null};
